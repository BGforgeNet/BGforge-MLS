<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'none'; font-src {{cspSource}}; img-src data:; style-src {{cspSource}}; script-src 'nonce-{{nonce}}';"
        />
        <title>Binary Editor</title>
        <!--
            Stylesheets load as link elements resolved through webview.asWebviewUri and authorised by
            `style-src {{cspSource}}`. They are NOT inlined as nonce'd style elements: VS Code's wrapped
            webview only honours style-src sources it can attribute to the webview origin (cspSource). A
            bare `style-src 'nonce-...'` is honoured by raw Chromium but silently ignored by the VS Code
            webview layer, leaving the panel unstyled. See docs/architecture.md (Webview CSP).
        -->
        <!--
            `img-src data:` and nothing else: the only images are resref thumbnails, which the host decodes and
            hands over as data URIs. Deliberately NOT cspSource - no image is loaded from the extension, so
            allowing that origin would widen the policy past what is used. Without this rule `default-src 'none'`
            blocks every thumbnail, and silently: the box renders, the picture does not.
        -->
        <link href="{{codiconsUri}}" rel="stylesheet" />
        <link href="{{stylesUri}}" rel="stylesheet" />
    </head>
    <body>
        <div id="app"></div>
        <script nonce="{{nonce}}">
            /* __SCRIPT__ */
        </script>
    </body>
</html>
