name: "Format source files"
description: "Format Fallout/WeiDU source files with @bgforge/format (fgfmt, in place) and commit the result back to the branch."
author: "BGforge"

inputs:
  paths:
    description: "Path passed to the format CLI (single path; recursive scan)."
    required: false
    default: "."
  version:
    description: "npm version specifier for @bgforge/format."
    required: false
    default: "latest"
  commit-message:
    description: "Commit subject when formatting changes files."
    required: false
    default: "style: format source files"
  commit-author-name:
    description: "git author name for the format commit."
    required: false
    default: "github-actions[bot]"
  commit-author-email:
    description: "git author email for the format commit."
    required: false
    default: "41898282+github-actions[bot]@users.noreply.github.com"
  check:
    description: 'If "true", verify files are already formatted (exit 1 on any unformatted file) and skip commit/push.'
    required: false
    default: "false"

outputs:
  changed:
    description: "true if any file was reformatted and committed."
    value: ${{ steps.commit.outputs.changed }}
  changed-files:
    description: "Newline-separated list of committed files."
    value: ${{ steps.commit.outputs.changed-files }}

runs:
  using: "composite"
  steps:
    - name: Guard against fork pull_request (read-only token cannot push)
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
      run: ${{ github.action_path }}/../_shared/guard-fork-pr.sh

    - name: Set up Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: 22

    - name: Install @bgforge/format
      shell: bash
      env:
        PKG_VERSION: ${{ inputs.version }}
      run: npm install -g "@bgforge/format@${PKG_VERSION}"

    - name: List changed source files
      id: list
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        SCAN_PATH: ${{ inputs.paths }}
        BASE_SHA_PR: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA_PR: ${{ github.event.pull_request.head.sha }}
        BASE_SHA_PUSH: ${{ github.event.before }}
        HEAD_SHA_PUSH: ${{ github.sha }}
      run: ${{ github.action_path }}/scripts/list-changed.sh

    - name: Run format CLI (--save by default, --check when check=true)
      shell: bash
      env:
        CLI: fgfmt
        CHECK_MODE: ${{ inputs.check }}
        LIST: ${{ steps.list.outputs.list }}
        COUNT: ${{ steps.list.outputs.count }}
      run: ${{ github.action_path }}/../_shared/run-cli.sh

    - name: Commit and push if changed
      id: commit
      if: inputs.check != 'true'
      shell: bash
      env:
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
        COMMIT_AUTHOR_NAME: ${{ inputs.commit-author-name }}
        COMMIT_AUTHOR_EMAIL: ${{ inputs.commit-author-email }}
        LIST: ${{ steps.list.outputs.list }}
      run: ${{ github.action_path }}/scripts/commit-and-push.sh
