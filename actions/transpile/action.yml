name: "Transpile sources"
description: "Transpile TSSL/TBAF/TD sources to Fallout SSL / WeiDU BAF / WeiDU D with @bgforge/transpile (fgtp) and commit the generated files back to the branch."
author: "BGforge"

inputs:
  paths:
    description: "Path passed to the transpile CLI (single path; recursive scan)."
    required: false
    default: "."
  version:
    description: "npm version specifier for @bgforge/transpile."
    required: false
    default: "latest"
  commit-message:
    description: "Commit subject when transpiled output changes."
    required: false
    default: "chore: update transpiled output"
  commit-author-name:
    description: "git author name for the transpile commit."
    required: false
    default: "github-actions[bot]"
  commit-author-email:
    description: "git author email for the transpile commit."
    required: false
    default: "41898282+github-actions[bot]@users.noreply.github.com"
  check:
    description: 'If "true", verify each output is up to date with its source (exit 1 on diff or missing output) and skip commit/push.'
    required: false
    default: "false"

outputs:
  changed:
    description: "true if any transpiled output changed and was committed."
    value: ${{ steps.commit.outputs.changed }}
  changed-files:
    description: "Newline-separated list of committed output files."
    value: ${{ steps.commit.outputs.changed-files }}

runs:
  using: "composite"
  steps:
    - name: Guard against fork pull_request (read-only token cannot push)
      if: inputs.check != 'true'
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
      run: ${{ github.action_path }}/../_shared/guard-fork-pr.sh

    - name: Set up Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 24

    - name: Install @bgforge/transpile
      shell: bash
      env:
        PKG_VERSION: ${{ inputs.version }}
      # zizmor: ignore[adhoc-packages] this step's purpose IS installing the
      # consumer-selected published @bgforge/transpile version to run it; there is
      # no lockfile to install from since the version is a caller-chosen input.
      run: npm install -g "@bgforge/transpile@${PKG_VERSION}"

    - name: List changed source files
      id: list
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        SCAN_PATH: ${{ inputs.paths }}
        BASE_SHA_PR: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA_PR: ${{ github.event.pull_request.head.sha }}
        BASE_SHA_PUSH: ${{ github.event.before }}
        HEAD_SHA_PUSH: ${{ github.sha }}
      run: ${{ github.action_path }}/scripts/list-changed.sh

    - name: Run transpile CLI (--save by default, --check when check=true)
      shell: bash
      env:
        CLI: fgtp
        CHECK_MODE: ${{ inputs.check }}
        LIST: ${{ steps.list.outputs.list }}
        COUNT: ${{ steps.list.outputs.count }}
      run: ${{ github.action_path }}/../_shared/run-cli.sh

    - name: Commit and push if changed
      id: commit
      if: inputs.check != 'true'
      shell: bash
      env:
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
        COMMIT_AUTHOR_NAME: ${{ inputs.commit-author-name }}
        COMMIT_AUTHOR_EMAIL: ${{ inputs.commit-author-email }}
        LIST: ${{ steps.list.outputs.list }}
      run: ${{ github.action_path }}/scripts/commit-and-push.sh
