name: "Compile TSSL"
description: "Compile TSSL sources to Fallout INT bytecode with @bgforge/tssl, and commit the generated .ssl when transpile is on."
author: "BGforge"

inputs:
  paths:
    description: "Path passed to the tssl CLI (single path; recursive scan)."
    required: false
    default: "."
  version:
    description: "npm version specifier for @bgforge/tssl."
    required: false
    default: "latest"
  transpile:
    description: 'If "true", also write the readable .ssl beside each .int and commit it. The .int is never committed.'
    required: false
    default: "false"
  opt:
    description: "Optimisation level passed to the compiler (0, 1 or 2). Empty uses the compiler's default."
    required: false
    default: ""
  short-circuit:
    description: 'If "true", compile and/or to skip the right operand once the left decides the result.'
    required: false
    default: "false"
  commit-message:
    description: "Commit subject when compiled output changes."
    required: false
    default: "chore: update compiled output"
  commit-author-name:
    description: "git author name for the compile commit."
    required: false
    default: "github-actions[bot]"
  commit-author-email:
    description: "git author email for the compile commit."
    required: false
    default: "41898282+github-actions[bot]@users.noreply.github.com"
  check:
    description: 'If "true", verify the committed .ssl is up to date with its source (exit 1 if stale) and skip commit/push. Only meaningful with transpile: "true" - with it off, compiling is already the check.'
    required: false
    default: "false"

outputs:
  changed:
    description: "true if any generated .ssl changed and was committed."
    value: ${{ steps.commit.outputs.changed }}
  changed-files:
    description: "Newline-separated list of committed .ssl files."
    value: ${{ steps.commit.outputs.changed-files }}

runs:
  using: "composite"
  steps:
    - name: Guard against fork pull_request (read-only token cannot push)
      if: inputs.check != 'true' && inputs.transpile == 'true'
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
      run: ${{ github.action_path }}/../_shared/guard-fork-pr.sh

    - name: Set up Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: 24

    - name: Install @bgforge/tssl
      shell: bash
      env:
        PKG_VERSION: ${{ inputs.version }}
      # zizmor: ignore[adhoc-packages] this step's purpose IS installing the
      # consumer-selected published @bgforge/tssl version to run it; there is no
      # lockfile to install from since the version is a caller-chosen input.
      run: npm install -g "@bgforge/tssl@${PKG_VERSION}"

    - name: Build the compiler switches
      id: switches
      shell: bash
      env:
        TRANSPILE: ${{ inputs.transpile }}
        OPT: ${{ inputs.opt }}
        SHORT_CIRCUIT: ${{ inputs.short-circuit }}
      run: ${{ github.action_path }}/scripts/switches.sh

    - name: Compile every .tssl under the scan path
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.paths }}
        EXTRA_ARGS: ${{ steps.switches.outputs.args }}
      run: ${{ github.action_path }}/scripts/run.sh

    - name: Verify or commit the generated .ssl
      id: commit
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.paths }}
        TRANSPILE: ${{ inputs.transpile }}
        CHECK_MODE: ${{ inputs.check }}
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
        COMMIT_AUTHOR_NAME: ${{ inputs.commit-author-name }}
        COMMIT_AUTHOR_EMAIL: ${{ inputs.commit-author-email }}
      run: ${{ github.action_path }}/scripts/finish.sh
