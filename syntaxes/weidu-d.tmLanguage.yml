$schema: https://raw.githubusercontent.com/martinring/tmlanguage/master/tmlanguage.json
name: WeiDU dialog
scopeName: source.weidu-d

patterns:
  - include: '#condition'
  - include: '#action'
  - include: '#comments'
  - include: '#condition-abbreviated'
  # Before #d-action, which matches these same keywords bare - first in the list wins at equal position.
  - include: '#patch-trigger'
  - include: '#patch-trans-trigger'
  - include: '#patch-trans-action'
  - include: '#d-action'
  - include: '#action-when'
  - include: '#chain-epilogue'
  - include: '#state'
  - include: '#transition'
  - include: '#transfeature'
  - include: '#transnext'
  - include: '#reference'
  - include: '#numbers'
  - include: '#strings'
  - include: '#vars' # D can be COMPILE EVAL
  - include: '#sugar-operators'
  - include: '#sugar'

repository:
  comments:
    patterns:
      - match: (//).*
        name: comment.line.weidu-d
      - begin: /\*
        end: \*/
        name: comment.block.weidu-d

  numbers:
    patterns:
      - match: \b(([0-9]+)|(0x[0-9a-fA-F]+))\b
        name: "constant.numeric.weidu-d"

  d-action:
    # Auto-generated from weidu-d-base.yml - do not edit manually.
    name: support.function.weidu-baf.action
    patterns:
      - match: \b(ADD_STATE_TRIGGER)\b
      - match: \b(ADD_TRANS_ACTION)\b
      - match: \b(ADD_TRANS_TRIGGER)\b
      - match: \b(ALTER_TRANS)\b
      - match: \b(APPEND)\b
      - match: \b(APPEND_EARLY)\b
      - match: \b(BEGIN)\b
      - match: \b(CHAIN)\b
      - match: \b(EXTEND_BOTTOM)\b
      - match: \b(EXTEND_TOP)\b
      - match: \b(INTERJECT)\b
      - match: \b(INTERJECT_COPY_TRANS)\b
      - match: \b(INTERJECT_COPY_TRANS2)\b
      - match: \b(INTERJECT_COPY_TRANS3)\b
      - match: \b(INTERJECT_COPY_TRANS4)\b
      - match: \b(I_C_T)\b
      - match: \b(I_C_T2)\b
      - match: \b(I_C_T3)\b
      - match: \b(I_C_T4)\b
      - match: \b(REPLACE)\b
      - match: \b(REPLACE_ACTION_TEXT)\b
      - match: \b(REPLACE_ACTION_TEXT_PROCESS)\b
      - match: \b(REPLACE_ACTION_TEXT_PROCESS_REGEXP)\b
      - match: \b(REPLACE_ACTION_TEXT_REGEXP)\b
      - match: \b(REPLACE_SAY)\b
      - match: \b(REPLACE_STATE_TRIGGER)\b
      - match: \b(REPLACE_TRANS_ACTION)\b
      - match: \b(REPLACE_TRANS_TRIGGER)\b
      - match: \b(REPLACE_TRIGGER_TEXT)\b
      - match: \b(REPLACE_TRIGGER_TEXT_REGEXP)\b
      - match: \b(R_A_T_P_R)\b
      - match: \b(SET_WEIGHT)\b

  action-when:
    # Auto-generated from weidu-d-base.yml - do not edit manually.
    name: keyword.other.weidu-d
    patterns:
      - match: \b(IF)\b
      - match: \b(UNLESS)\b

  chain-epilogue:
    # Auto-generated from weidu-d-base.yml - do not edit manually.
    name: keyword.other.weidu-d
    patterns:
      - match: \b(COPY_TRANS)\b
      - match: \b(COPY_TRANS_LATE)\b

  state:
    # Auto-generated from weidu-d-base.yml - do not edit manually.
    name: keyword.other.weidu-d
    patterns:
      - match: \b(APPENDI)\b
      - match: \b(CHAIN2)\b
      - match: \b(SAY)\b

  transition:
    # Auto-generated from weidu-d-base.yml - do not edit manually.
    name: keyword.other.weidu-d
    patterns:
      - match: \b(COPY_TRANS)\b
      - match: \b(COPY_TRANS_LATE)\b

  transfeature:
    # Auto-generated from weidu-d-base.yml - do not edit manually.
    name: keyword.other.weidu-d
    patterns:
      - match: \b(DO)\b
      - match: \b(FLAGS)\b
      - match: \b(JOURNAL)\b
      - match: \b(REPLY)\b
      - match: \b(SOLVED_JOURNAL)\b
      - match: \b(UNSOLVED_JOURNAL)\b

  transnext:
    # Auto-generated from weidu-d-base.yml - do not edit manually.
    name: keyword.other.weidu-d
    patterns:
      - match: \b(EXIT)\b
      - match: \b(EXTERN)\b
      - match: \b(GOTO)\b

  reference:
    patterns:
      - match: \s(@)([0-9]+)\s
        captures:
          '1':
            name: keyword.weidu-d.trastart
          '2':
            name: variable.parameter.tra.weidu-d
      - match: \s(#)([0-9]+)\s
        name: variable.parameter.weidu-tra
      - match: \s(\( AT "(\w+)"\))\s
        name: variable.parameter.weidu-tra

  condition:
    name: meta.weidu-d.condition
    # Optional WEIGHT #n guard between IF and the trigger string (IF WEIGHT #5 ~...~); the group is
    # non-capturing so capture indices stay 1=IF, 2=~.
    begin: '\b(IF)\b(?:\s+WEIGHT\s+#\s*-?[0-9]+)?\s+(~)'
    beginCaptures:
      "1":
        name: keyword.other.weidu-d
      "2":
        name: string.quoted.weidu-d.tilde
    end: '(~)'
    endCaptures:
      "1":
        name: string.quoted.weidu-d.tilde
    patterns:
      - include: source.weidu-baf#condition-body

  # this one should come later, when most of the text is taken
  condition-abbreviated:
    begin: '\s+(\+)\s*(~)'
    beginCaptures:
      "1":
        name: keyword.other.weidu-d
      "2":
        name: string.quoted.weidu-d.tilde
    end: '(~)'
    endCaptures:
      "1":
        name: string.quoted.weidu-d.tilde
    patterns:
      - include: source.weidu-baf#condition-body

  action:
    name: meta.weidu-d.action
    begin: '\b(DO)\b\s+(~)'
    beginCaptures:
      "1":
        name: keyword.other.weidu-d
      "2":
        name: string.quoted.tilde.weidu-d
    end: '(~)'
    endCaptures:
      "1":
        name: string.quoted.tilde.weidu-d
    patterns:
      - include: source.weidu-baf#action-body

  # The patch commands (README-WeiDU, "d Action" commands) carry their trigger/action as a bare tilde-string
  # with no IF/DO in front of it, so each rule has to consume the arguments its own syntax puts first. The
  # filename argument may ITSELF be tilde-quoted (ADD_STATE_TRIGGER ~imoen2p~ 8 ~trigger~), so counting
  # arguments is the only way to tell the file from the body. Argument runs are re-tokenized through the
  # ordinary rules so they keep the colouring they had before these rules existed.

  # filename stateNumber ~body~ - ADD_STATE_TRIGGER, ADD_TRANS_TRIGGER, REPLACE_STATE_TRIGGER. Ends at the
  # closing tilde rather than end-of-line: state numbers and a DO clause may follow, and they colour normally.
  patch-trigger:
    name: meta.weidu-d.condition
    begin: '\b(ADD_STATE_TRIGGER|ADD_TRANS_TRIGGER|REPLACE_STATE_TRIGGER)\b(\s+(?:~[^~]*~|[%\w#]+)\s+(?:[%\w#]+))\s+(~)'
    beginCaptures:
      "1":
        name: support.function.weidu-baf.action
      "2":
        patterns:
          - include: '#strings'
          - include: '#vars'
          - include: '#numbers'
      "3":
        name: string.quoted.tilde.weidu-d
    end: '(~)'
    endCaptures:
      "1":
        name: string.quoted.tilde.weidu-d
    patterns:
      - include: source.weidu-baf#condition-body

  # filename BEGIN states END BEGIN trans END oldText newText - both strings are TRIGGERS. Same argument shape
  # as patch-trans-action below and a different body language, which is why they are two rules.
  patch-trans-trigger:
    name: meta.weidu-d.condition
    begin: '\b(REPLACE_TRANS_TRIGGER)\b(\s+(?:~[^~]*~|[%\w#]+)\s+BEGIN\b[^~]*?\bEND\b\s+BEGIN\b[^~]*?\bEND\b)'
    beginCaptures:
      "1":
        name: support.function.weidu-baf.action
      "2":
        patterns:
          - include: '#patch-argument-run'
    end: '(?=\b(?:IF|UNLESS)\b)|$'
    patterns:
      - include: '#patch-condition-string'

  # filename BEGIN states END BEGIN trans END [action] - ADD_TRANS_ACTION takes one string and may omit it,
  # REPLACE_TRANS_ACTION takes oldText and newText. Ends before a trailing IF/UNLESS clause so it still colours.
  patch-trans-action:
    name: meta.weidu-d.action
    begin: '\b(ADD_TRANS_ACTION|REPLACE_TRANS_ACTION)\b(\s+(?:~[^~]*~|[%\w#]+)\s+BEGIN\b[^~]*?\bEND\b\s+BEGIN\b[^~]*?\bEND\b)'
    beginCaptures:
      "1":
        name: support.function.weidu-baf.action
      "2":
        patterns:
          - include: '#patch-argument-run'
    end: '(?=\b(?:IF|UNLESS)\b)|$'
    patterns:
      - include: '#patch-action-string'

  # The filename and BEGIN..END blocks of a patch command, coloured as they are outside one.
  patch-argument-run:
    patterns:
      - include: '#strings'
      - include: '#vars'
      - include: '#numbers'
      - include: '#d-action' # BEGIN
      - include: '#sugar' # END

  patch-condition-string:
    begin: '(~)'
    beginCaptures:
      "1":
        name: string.quoted.tilde.weidu-d
    end: '(~)'
    endCaptures:
      "1":
        name: string.quoted.tilde.weidu-d
    patterns:
      - include: source.weidu-baf#condition-body

  patch-action-string:
    begin: '(~)'
    beginCaptures:
      "1":
        name: string.quoted.tilde.weidu-d
    end: '(~)'
    endCaptures:
      "1":
        name: string.quoted.tilde.weidu-d
    patterns:
      - include: source.weidu-baf#action-body

  strings:
    patterns:
      - name: string.quoted.tilde.weidu-d
        begin: '~'
        end: '~'
        patterns:
          - include: '#vars'

  vars:
    name: variable.parameter.weidu-d
    patterns:
      - match: '(%[^%]+%)'

  # Non-word operators that can't use \b word boundaries - kept separate
  # from the auto-generated sugar stanza.
  sugar-operators:
    patterns:
      - name: keyword.weidu-d
        match: \+

  sugar:
    # Auto-generated from weidu-d-base.yml - do not edit manually.
    name: keyword.weidu-d
    patterns:
      - match: \b(BRANCH)\b
      - match: \b(END)\b
      - match: \b(GLOBAL)\b
      - match: \b(IF_FILE_EXISTS)\b
      - match: \b(LOCALS)\b
      - match: \b(MYAREA)\b
      - match: \b(OR)\b
      - match: \b(RESPONSE)\b
      - match: \b(SAFE)\b
      - match: \b(THEN)\b
      - match: \b(WEIGHT)\b
      - match: \b(nonPausing)\b
