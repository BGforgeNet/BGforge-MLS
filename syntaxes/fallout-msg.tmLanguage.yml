$schema: https://raw.githubusercontent.com/martinring/tmlanguage/master/tmlanguage.json
name: Fallout Star-Trek Scripting Language message
scopeName: source.fallout-msg
patterns:
  - include: "#entries"
  - include: "#skipped"
  - include: "#stray-braces"
repository:
  # The game loads a file by scanning for `{`: a brace group is an entry wherever it sits - after a `#`, a `//`
  # or inside `/* */` too - and all other text is skipped. There is no comment syntax.
  skipped:
    patterns:
      - match: "[^{}]+"
        name: comment.line.fallout-msg
  # A `}` outside an entry, or a `{` that opens no entry, makes the game refuse the whole file.
  stray-braces:
    patterns:
      - match: "[{}]"
        name: invalid.illegal.fallout-msg
  entries:
    patterns:
      - begin: ({)([+-]?\d+)(}{)([^}]*)(}{)
        beginCaptures:
          "1":
            name: keyword.control.fallout-msg
          "2":
            name: constant.other.linenum.fallout-msg
          "3":
            name: keyword.control.fallout-msg
          "4":
            name: entity.name.function.sound.fallout-msg
          "5":
            name: keyword.control.fallout-msg
        end: (})
        endCaptures:
          "1":
            name: keyword.control.fallout-msg
        name: string.quoted.fallout-msg
