$schema: https://raw.githubusercontent.com/martinring/tmlanguage/master/tmlanguage.json
name: WeiDU script
scopeName: source.weidu-baf

patterns:
  - include: '#comments'
  - include: '#condition'
  - include: '#action'
  - include: '#vars'
  - include: '#condition-body'
  - include: '#actions' # for completion - must be last

repository:
  comments:
    patterns:
      - match: (//).*
        name: comment.line.weidu-baf
      - begin: /\*
        end: \*/
        name: comment.block.weidu-baf

  numbers:
    patterns:
      - match: \b(([0-9]+)|(0x[0-9a-fA-F]+))\b
        name: constant.numeric.weidu-baf

  condition:
    begin: \b(IF)\b
    end: \b(THEN)\b
    name: meta.condition.weidu-baf
    beginCaptures:
      '1':
        name: keyword.control.weidu-baf
    endCaptures:
      '1':
        name: keyword.control.weidu-baf
    patterns:
      - include: '#condition-body'

  condition-body:
    # for inclusion in .d
    name: meta.condition-body.weidu-baf
    patterns:
      - include: '#identifiers'
      - include: '#comments'
      - include: '#vartype'
      - include: '#strings'
      - include: '#numbers'
      - include: '#tra-ref'
      - include: '#operators'
      - include: '#triggers'
      - include: '#vars'
      - include: '#constants-irregular'
      - include: '#constants-casing'

  action:
    name: meta.action.weidu-baf
    begin: \b(RESPONSE)\b\s+(#[0-9]+) #first response line colored individially
    beginCaptures:
      '1':
        name: keyword.control.weidu-baf
      '2':
        name: constant.numeric.weidu-baf
    end: \b(END)\b
    endCaptures:
      '1':
        name: keyword.control.weidu-baf
    patterns:
      - include: '#action-body'

  action-body:
    patterns:
      - include: '#identifiers'
      - include: '#comments'
      - include: '#vartype'
      - include: '#strings'
      - include: '#numbers'
      - include: '#response'
      - include: '#tra-ref'
      - include: '#operators'
      - include: '#actions'
      - include: '#actions-extras'
      - include: '#vars'
      - include: '#constants-irregular'
      - include: '#constants-casing'

  response:
    name: keyword.control.weidu-baf
    patterns:
      - match: \b(RESPONSE)\b\s+(#[0-9]+)
        captures:
          '2':
            name: constant.numeric.weidu-baf

  vartype:
    name: keyword.control.weidu-baf
    patterns:
      - match: (")\b(LOCALS|GLOBAL|MYAREA)\b(")
        captures:
          '1':
            name: string.quoted.double.weidu-baf
          '3':
            name: string.quoted.double.weidu-baf

  tra-ref:
    patterns:
      - match: (@)([0-9]+)
        captures:
          '1':
            name: keyword.weidu-baf.trastart
          '2':
            name: variable.parameter.tra.weidu-baf

  operators:
    name: keyword.control.weidu-baf
    patterns:
      - match: \b(OR)\b|(!)

  strings:
    patterns:
      - name: string.quoted.double.weidu-baf
        begin: '"'
        end: '"'
        patterns:
          - include: '#vars'

  vars:
    name: variable.parameter.weidu-baf
    patterns:
      - match: (%[^%]+%)

  identifiers:
    name: constant.other.weidu-baf
    patterns:
      - include: '#object-ids'
      - include: '#ea-ids'
      - include: '#general-ids'
      - include: '#gender-ids'
      - include: '#race-ids'

  # Names a casing rule cannot express, kept enumerated. MUST be included BEFORE constants-casing:
  # TextMate is first-match-wins at a position, so whichever rule is listed first claims the token.
  #   - CasterHold: genuine STATS.IDS entry 70 (IESDP, identical in bg1/bg2/iwd) while its 223 siblings
  #     are ALL-CAPS. An upstream inconsistency in the game's own IDS file, not a typo here.
  #   - Hyphenated names: \b[A-Z][A-Z0-9_]*\b matches KUO and TOA separately and would render the name as
  #     two fragments. Widening the character class to include "-" would over-match instead.
  constants-irregular:
    name: constant.other.weidu-baf
    patterns:
      - match: \b(CasterHold)\b
        name: constant.other.weidu-baf
      - match: \b(GIANT_YAGA-SHURA)\b
        name: constant.other.weidu-baf
      - match: \b(KUO-TOA_LARGE)\b
        name: constant.other.weidu-baf
      - match: \b(KUO-TOA)\b
        name: constant.other.weidu-baf
      - match: \b(WILL-O-WISP)\b
        name: constant.other.weidu-baf
      - match: \b(YUAN-TI_ELITE)\b
        name: constant.other.weidu-baf
      - match: \b(YUAN-TI_HALF)\b
        name: constant.other.weidu-baf
      - match: \b(YUAN-TI_PRIEST)\b
        name: constant.other.weidu-baf
      - match: \b(YUAN-TI)\b
        name: constant.other.weidu-baf

  # Every IDS constant except the irregulars above is ALL-CAPS (2723 of 2841 names, across ~20 IDS
  # categories). Enumerating them cost ~200 KB of grammar for information one character class carries.
  # This rule replaces them.
  #
  # Note the asymmetry with the tree-sitter side (grammars/weidu-baf/queries/highlights.scm), which
  # identifies the same constants by POSITION (`call_expr args:`) rather than casing. That is deliberate:
  # tree-sitter has a parse tree and can ask "is this identifier an argument"; TextMate has only regex and
  # cannot. Same colours, different mechanisms, because the engines differ in capability.
  #
  # Ordering is load-bearing: triggers, actions, object-ids, and constants-irregular MUST be included
  # before this rule, or it claims the 13 ALL-CAPS call names (HP, XP, G, LOS, OR, INI, SG, ...) as
  # constants. server/test/weidu-baf/textmate-syntax.test.ts guards that.
  constants-casing:
    patterns:
      - match: \b[A-Z][A-Z0-9_]*\b
        name: constant.other.weidu-baf
