name: "Mutation Testing"

# Runs weekly so the stryker.conf.json thresholds are exercised on a schedule
# without slowing down the PR/push build path. Also available on demand.
#
# What it mutates, and why those files: the write path that turns an edited record back into bytes over a
# user's own game files. A surviving mutant there means a test that would not notice a corrupted save, which
# is this project's worst failure - the inputs are irreplaceable and the editor writes in place. So the scope
# is the shared derived-field engine every writer syncs counts and offsets through (`spec/types.ts`), the
# ability/effects writer ITM, SPL and EFF share, and the two records with their own writers and the most
# structure to get wrong (CRE, MAP).
#
# Line and branch coverage floors already cover these files; mutation score is what distinguishes a test that
# executes the write path from one that would fail if the bytes came out wrong. The parsers and the SSL
# compiler are deliberately NOT here: the compiler is checked by a corpus differential against the reference
# compiler, which is a stronger oracle than mutation testing, and adding it would multiply the weekly runtime
# for a weaker signal.
#
# The thresholds are LOWER than the ones the previous scope carried, and that is not a relaxed standard - it
# is a harder surface measured honestly. The old scope was three server files (URI normalization and index
# plumbing) sitting above 70. This scope's first full run scored 57.10 overall: ability-effects-writer 80.00,
# spec/types 63.64, map/canonical-writer 57.86, cre/canonical-writer 37.33 with 21 mutants no test reaches at
# all. The floors are set just under that first measurement so a regression fails while the gate stays usable,
# and they are meant to ratchet up as the write-path tests improve - the CRE writer is where the gap is, and
# closing it is worth more than any single number here.
on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC
  workflow_dispatch:

# Scheduled and manually-dispatched runs alike are never cancelled by a superseding
# run - a half-finished mutation-testing pass is worse than an occasional duplicate.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mutation:
    name: mutation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generates the tree-sitter.d.ts type declarations the sources import. Unlike the Build
      # workflow, this job doesn't otherwise build grammars; weidu-tp2's declaration is gitignored,
      # so without this step Stryker can't resolve it and every importing module fails to compile.
      - name: Build tree-sitter grammar
        run: pnpm build:grammar

      - name: Run mutation tests
        run: pnpm test:mutation
        continue-on-error: false

      - name: Upload mutation report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: tmp/mutation/
          if-no-files-found: warn
          # Weekly run; two weeks of history is enough for trend
          # comparison. Drop the 90-day default.
          retention-days: 14
