name: "Mutation Testing"

# Runs weekly so the stryker.conf.json thresholds are exercised on a schedule
# without slowing down the PR/push build path. Also available on demand.
on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC
  workflow_dispatch:

# Scheduled and manually-dispatched runs alike are never cancelled by a superseding
# run - a half-finished mutation-testing pass is worse than an occasional duplicate.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mutation:
    name: mutation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generates the tree-sitter.d.ts type declarations the sources import. Unlike the Build
      # workflow, this job doesn't otherwise build grammars; weidu-tp2's declaration is gitignored,
      # so without this step Stryker can't resolve it and every importing module fails to compile.
      - name: Build tree-sitter grammar
        run: pnpm build:grammar

      - name: Run mutation tests
        run: pnpm test:mutation
        continue-on-error: false

      - name: Upload mutation report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: tmp/mutation/
          if-no-files-found: warn
          # Weekly run; one quarter is enough history for trend
          # comparison. Drop the 90-day default.
          retention-days: 90
