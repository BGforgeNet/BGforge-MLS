name: "Build"

on:
  pull_request:
  push:
    # Only vX.Y.Z tags drive the release job; the internal release steps gate on
    # startsWith(github.ref, 'refs/tags/'), which matches any tag, so non-release
    # tags (e.g. the actions/binary/* action tag) must be filtered out here before
    # they can reach those steps. branches: "**" preserves branch-push CI.
    branches:
      - "**"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

# Cancel superseded runs on the same ref. Release-tag runs use distinct refs
# (refs/tags/vX.Y.Z) and are not affected; PR pushes and branch pushes get the
# stale run cancelled when a newer push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # contents: write is needed for the GitHub Release step on tag pushes.
    # id-token: write is needed for pnpm publish --provenance (npm OIDC attestation)
    # in the server, transpile, format, and binary publish steps on release tags.
    permissions:
      contents: write
      id-token: write
    outputs:
      # base64-encoded sha256 digests of release artifacts, consumed by the
      # SLSA provenance job.  Empty on non-release runs.
      artifact-subjects: ${{ steps.artifact-hashes.outputs.subjects }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify supply-chain invariants
        run: ./scripts/verify-supply-chain.sh

      - name: Install apt packages (xmllint for the XSD tests; xvfb for E2E on release)
        env:
          XVFB: ${{ startsWith(github.ref, 'refs/tags/') && 'xvfb' || '' }}
        run: |
          pkgs=(libxml2-utils)
          [[ -n "$XVFB" ]] && pkgs+=(xvfb)
          sudo apt-get install -y "${pkgs[@]}"

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Both caches are skipped on release-tag runs so release artifacts are
      # never built from restored state (zizmor's cache-poisoning surface).
      # Grammar cache: generated parsers are revalidated by the content-hash
      # stamp in scripts/grammar-generate-lib.sh, so even a stale hit is safe;
      # ~/.cache/tree-sitter holds the wasi-sdk the WASM builds download.
      - name: Restore generated-grammar cache (non-release only)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            grammars/*/src
            ~/.cache/tree-sitter
          key: grammars-${{ runner.os }}-${{ hashFiles('grammars/*/grammar.js', 'grammars/*/tree-sitter.json', 'pnpm-lock.yaml') }}

      # External corpus cache: keyed strictly on the pinned-ref lists with no
      # restore-keys - clone_repos skips already-present repos, so a stale
      # restore at an old ref would silently test the wrong corpus. A ref bump
      # changes the key and forces a fresh clone.
      - name: Restore external-corpus cache (non-release only)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            external/fallout
            external/infinity-engine
          key: external-${{ hashFiles('external/fallout.txt', 'external/infinity-engine.txt', 'external/*-exclude.txt') }}

      - name: Build tree-sitter grammar
        run: pnpm build:grammar

      # The grammar differential suite skips without a WeiDU binary, so without a binary it would pass
      # by never running. The test scripts call this too, so CI and a local run resolve the same pinned
      # WeiDU; here it also lands on PATH for the steps below. See scripts/ensure-weidu.sh.
      - name: Install WeiDU
        run: ./scripts/ensure-weidu.sh

      - name: Test
        run: pnpm test:all

      - name: Build
        run: pnpm build

      # E2E needs xvfb and a full Electron host, so it runs only on release tags.
      # On every PR/push, the webview-bundle tests in client/test/ and the server
      # stdio smoke test (server/vitest.smoke.config.ts, driven by scripts/test.sh
      # Phase 3) cover the same surfaces the E2E driver would exercise.
      - name: E2E tests (release only)
        if: startsWith(github.ref, 'refs/tags/')
        run: pnpm test:e2e

      - name: Package
        run: |
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            export ARTIFACT_VERSION="${GITHUB_SHA::7}"
          fi
          pnpm package
          echo "VSIX_PATH=$(ls dist/*.vsix)" >> "$GITHUB_ENV"

      - name: Generate CycloneDX SBOM
        # The SBOM is attached to the GitHub Release, so it is only needed on
        # release-tag builds; skip the ~minute of cyclonedx work on branch/PR pushes.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          # --allow-build=libxmljs2: cyclonedx pulls libxmljs2 (native; ships a prebuilt binary
          # via prebuild-install) as a transitive dep. pnpm 11 fails closed on an unclassified
          # install script (ERR_PNPM_IGNORED_BUILDS), and `pnpm dlx` resolves in a throwaway dir
          # outside the workspace, so the pnpm-workspace.yaml allowBuilds list does not apply -
          # allow it inline.
          # --ignore-npm-errors: cyclonedx-npm shells out to `npm ls`, which misreads pnpm's
          # symlinked store and reports transitive devDependencies (e.g. isexe's) as missing.
          # The component tree is still walked in full, so treat those npm-ls warnings as
          # non-fatal rather than failing the build.
          pnpm dlx --allow-build=libxmljs2 @cyclonedx/cyclonedx-npm@4.2.1 --ignore-npm-errors --output-file dist/sbom.cdx.json

      - name: Build editor bundles (TextMate, Kate, Notepad++, Geany)
        run: pnpm build:editors

      # Generated parser sources are gitignored, so a clone cannot feed the tree-sitter
      # recipes in docs/editors/. This archive is what those recipes consume. It lands in
      # dist/ as a .zip, which the artifact-hash, upload and release steps below already
      # glob - so it is provenance-covered and attached to the release without listing it
      # again. Requires the Build tree-sitter grammar step above to have run.
      - name: Package tree-sitter grammars
        run: ./scripts/package-grammars.sh

      # Runs on every push, not just releases: the suites parse through WASM and never open
      # this archive, so this is the only check that the shipped sources build for a consumer.
      - name: Verify the grammar bundle compiles
        run: ./scripts/verify-grammar-bundle.sh

      # Two separate uploads so the VSIX can be fetched on its own, apart from the
      # editor bundles and SBOM. Default 90-day retention is excessive for branch
      # builds; 14 days is enough to inspect a CI artifact from a recent push or PR.
      - name: Upload VSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: bgforge-mls-vsix
          path: dist/*.vsix
          retention-days: 14

      # The `dist/*.zip` glob carries the editor bundles AND the tree-sitter grammar bundle, so an
      # unreleased grammar fix is consumable from this artifact rather than from a channel of its own.
      - name: Upload editor and grammar bundles and SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: bgforge-mls-bundles
          path: |
            dist/*.zip
            dist/sbom.cdx.json
          retention-days: 14

      # The GitHub Release (carrying the SLSA-provenance subjects and the SBOM) is
      # the canonical record of the build, so it is created before the extension is
      # pushed to the external marketplaces. All three reference env.VSIX_PATH (set
      # in the Package step) rather than the Open VSX step output, which no longer
      # precedes them.
      - name: Compute artifact hashes for SLSA provenance (release only)
        id: artifact-hashes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          # sha256sum emits "<hash>  <filename>" lines; slsa-github-generator
          # expects base64(sha256sum-output) as base64-subjects.
          subjects="$(sha256sum \
            "$VSIX_PATH" \
            dist/sbom.cdx.json \
            dist/*.zip \
            | base64 -w0)"
          echo "subjects=$subjects" >> "$GITHUB_OUTPUT"

      - name: GitHub Release
        if: "startsWith(github.ref, 'refs/tags/')"
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            ${{ env.VSIX_PATH }}
            dist/*.zip
            dist/sbom.cdx.json

      # Use pre-built VSIX for publishing: pnpm package (scripts/package.sh)
      # dereferences pnpm symlinks that vsce can't follow.
      # skipDuplicate makes a release-tag re-run idempotent: a registry that
      # already carries this version is skipped instead of failing the job, so
      # a partial release (e.g. one registry's token expired) can be completed
      # by re-running the tag without tripping over the registries that succeeded.
      - name: Publish to Open VSX Registry
        if: "startsWith(github.ref, 'refs/tags/')"
        uses: HaaLeo/publish-vscode-extension@ca5561daa085dee804bf9f37fe0165785a9b14db # v2
        with:
          pat: ${{ secrets.OPEN_VSX_TOKEN }}
          extensionFile: ${{ env.VSIX_PATH }}
          skipDuplicate: true

      - name: Publish to Visual Studio Marketplace
        if: "startsWith(github.ref, 'refs/tags/')"
        uses: HaaLeo/publish-vscode-extension@ca5561daa085dee804bf9f37fe0165785a9b14db # v2
        with:
          pat: ${{ secrets.VS_MARKETPLACE_TOKEN }}
          registryUrl: https://marketplace.visualstudio.com
          extensionFile: ${{ env.VSIX_PATH }}
          skipDuplicate: true

      # The server bundles @bgforge/format and the transpilers into server/out/server.js
      # (esbuild externalizes only vscode and esbuild-wasm), so @bgforge/mls-server declares
      # no @bgforge runtime dependency and publishes independently of the <lib>/vX.Y.Z library
      # tags - no library needs to be on npm first, and publish-server.sh does no @bgforge preflight.
      - name: Publish server to npm
        if: startsWith(github.ref, 'refs/tags/')
        run: SKIP_BUILD=1 ./scripts/publish-server.sh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  provenance:
    name: SLSA provenance
    needs: build
    # Only generate provenance for successful release-tag builds.
    if: >-
      needs.build.result == 'success' &&
      startsWith(github.ref, 'refs/tags/')
    # timeout-minutes is not a valid key on a job that calls a reusable workflow via
    # `uses:` (actionlint syntax-check); the slsa-github-generator workflow bounds its
    # own runtime.
    permissions:
      id-token: write
      contents: write
      actions: read
    # MUST be pinned to a full @vX.Y.Z tag, NOT a commit SHA, despite the
    # rest of this workflow's third-party-action SHA-pinning convention.
    # slsa-verifier validates the workflow_ref recorded in the provenance
    # attestation against the trusted builder's published tag - pinning by
    # SHA would make the resulting attestation unverifiable. See
    # https://github.com/slsa-framework/slsa-github-generator README.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.artifact-subjects }}
