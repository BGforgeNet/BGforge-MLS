name: "Publish library"

# Publishes a single @bgforge library (binary, format, or transpile) to npm when its
# own version tag is pushed. The libraries version independently of the extension, so
# they release on their own `<lib>/vX.Y.Z` tags here rather than on the repo-level
# `vX.Y.Z` tag that build.yml handles (VSIX + server). build.yml's push trigger is
# filtered to `vX.Y.Z` precisely so these library tags do not also start a full release.
on:
  push:
    tags:
      - "binary/v[0-9]+.[0-9]+.[0-9]+"
      - "format/v[0-9]+.[0-9]+.[0-9]+"
      - "transpile/v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

# A release publish must not be interrupted mid-run: a half-cancelled npm publish is
# worse than a duplicate run. Serialize per tag ref without cancelling in flight.
concurrency:
  group: publish-library-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # id-token: write is needed for `pnpm publish --provenance` (npm OIDC attestation).
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, test, and publish the tagged library
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: ./.github/scripts/publish-library.sh
