name: "Nightly grammars"

# Generated parser sources are gitignored, so the tree-sitter recipes in docs/editors/ cannot
# build from a clone. Releases carry the bundle for tagged versions; this publishes the same
# bundle from the default branch daily, so a grammar fix is consumable before the next release.
on:
  schedule:
    # 04:20 UTC - off the hour, after the other scheduled workflows.
    - cron: "20 4 * * *"
  workflow_dispatch:

# No cancel-in-progress: a half-cancelled publish can leave the rolling tag deleted with no
# release behind it.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  grammars:
    name: publish grammar bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Skip on forks: the rolling release belongs to the upstream repo, and a fork's scheduled
    # run would either fail on permissions or publish to the fork.
    if: github.repository == 'BGforgeNet/BGforge-MLS'
    permissions:
      # Creating and deleting the rolling prerelease and its tag.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No build cache here, unlike build.yml's non-release runs: a published artifact is never
      # assembled from restored state.
      - name: Build tree-sitter grammar
        run: pnpm build:grammar

      - name: Package tree-sitter grammars
        run: ./scripts/package-grammars.sh

      - name: Verify the grammar bundle compiles
        run: ./scripts/verify-grammar-bundle.sh

      - name: Publish rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
        run: ./.github/scripts/publish-nightly-grammars.sh
