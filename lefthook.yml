# Pre-commit static checks. Mirrors the fast gates in scripts/test.sh Phase 1
# (sans unit tests) so CI-breaking issues like unused exports, type errors,
# and lint regressions fail locally before a commit lands.
#
# Each command carries a glob so commits only pay for the checks their staged
# files can affect (a docs-only commit skips typechecks entirely). Typecheck
# globs are derived from real cross-package imports:
#   client -> server/src, shared/, binary-editor/, binary/ (webviews import all four)
#   binary-editor harness -> binary/src, client/src
#   server, binary, binary-editor, format, transpilers, scripts -> shared/
#   plugins -> self-contained (they read server/out build JSONs, not sources)
# A missed edge fails in CI (test.sh Phase 1 runs everything unconditionally),
# so the globs trade a small false-negative risk for per-commit speed.
#
# Commands whose whole invocation lives here call the binary in node_modules/.bin rather than
# going through `pnpm exec`, which costs ~1.6s of launcher startup per command before any work
# happens - 22 commands paid that. A script-backed command (knip:prod, lint:*, typecheck:svelte)
# still goes through pnpm so its flags keep one home in package.json; those scripts get
# node_modules/.bin on PATH already, so none of them needs a nested `pnpm exec` either.
pre-commit:
  parallel: true
  commands:
    knip:
      glob:
        - "*.{ts,mts,cts,tsx,js,mjs,svelte}"
        - "package.json"
        - "knip.ts"
        - "pnpm-workspace.yaml"
        - "pnpm-lock.yaml"
      run: node_modules/.bin/knip
    knip-prod:
      glob:
        - "*.{ts,mts,cts,tsx,js,mjs,svelte}"
        - "package.json"
        - "knip.ts"
        - "pnpm-workspace.yaml"
        - "pnpm-lock.yaml"
      run: pnpm knip:prod
    oxlint:
      glob:
        - "*.{ts,mts,cts,tsx,js,mjs,cjs,svelte}"
        - ".oxlintrc.json"
      # {staged_files} scopes the lint to the commit and keeps untracked scratch files from
      # blocking it. oxlint applies its ignorePatterns to explicit args too, so a commit whose
      # staged files are ALL inside an ignored path (e.g. binary-editor/test/harness/**) leaves
      # zero files for it to check - --no-error-on-unmatched-pattern keeps that a pass rather
      # than an error. Full-tree runs stay in test.sh/CI.
      run: node_modules/.bin/oxlint --no-error-on-unmatched-pattern {staged_files}
    lint-types:
      glob:
        - "*.{ts,mts,cts,tsx}"
        - "tsconfig*.json"
        - "package.json"
      # Type-aware pass (oxlint-tsgolint): floating/misused promises and non-thenable awaits, which the
      # syntax-only oxlint run above cannot see. Whole-tree rather than {staged_files} - the rules need a
      # complete program, not a file list - which costs a few seconds.
      run: pnpm lint:types
    lint-tests:
      glob:
        - "*.test.ts"
        - "*/test/**"
      # Vitest-plugin pass: committed `.only`, duplicate titles, duplicate or misordered hooks. Only the
      # rules that are clean and false-positive-free here are enabled - `expect-expect` is not among them,
      # since assertions in this suite routinely live in a per-file helper it cannot see.
      run: pnpm lint:tests
    oxfmt-check:
      glob:
        - "*.{ts,mts,cts,tsx,js,mjs,cjs,json,md,yml,yaml}"
        - ".oxfmtrc.json"
      # Same zero-target case as oxlint above: a commit staging only oxfmt-ignored files
      # (e.g. pnpm-lock.yaml alone) must pass, not error out.
      run: node_modules/.bin/oxfmt --check --no-error-on-unmatched-pattern {staged_files}
    lint-shell:
      glob: "*.sh"
      run: pnpm lint:shell
    lint-workflows:
      glob:
        - ".github/**"
        - "actions/**"
        - "zizmor.yml"
      run: pnpm lint:workflows
    lint-scripts:
      glob:
        - "scripts/**"
        - "shared/**"
        - "tsconfig*.json"
        - "pnpm-workspace.yaml"
        - "pnpm-lock.yaml"
      run: pnpm lint:scripts
    typecheck-server:
      glob:
        - "server/**"
        - "shared/**"
        - "tsconfig*.json"
        - "package.json"
        - "pnpm-workspace.yaml"
        - "pnpm-lock.yaml"
      run: node_modules/.bin/tsc --noEmit --project server/tsconfig.json
    typecheck-client:
      glob:
        - "client/**"
        - "server/**"
        - "shared/**"
        - "binary-editor/**"
        - "binary/**"
        - "tsconfig*.json"
        - "package.json"
        - "pnpm-workspace.yaml"
        - "pnpm-lock.yaml"
      run: node_modules/.bin/tsc --noEmit --project client/tsconfig.json
    typecheck-binary:
      glob:
        - "binary/**"
        - "shared/**"
        - "tsconfig*.json"
        - "package.json"
        - "pnpm-workspace.yaml"
        - "pnpm-lock.yaml"
      run: node_modules/.bin/tsc --noEmit --project binary/tsconfig.json
    typecheck-image:
      glob:
        - "image/**"
        - "tsconfig*.json"
        - "package.json"
        - "pnpm-workspace.yaml"
        - "pnpm-lock.yaml"
      run: node_modules/.bin/tsc --noEmit --project image/tsconfig.json
    typecheck-bcs:
      glob:
        - "compilers/bcs/**"
        - "tsconfig*.json"
        - "package.json"
        - "pnpm-workspace.yaml"
        - "pnpm-lock.yaml"
      run: node_modules/.bin/tsc --noEmit --project compilers/bcs/tsconfig.json
    typecheck-ssl:
      glob:
        - "compilers/ssl/**"
        - "shared/**"
        - "tsconfig*.json"
        - "package.json"
        - "pnpm-workspace.yaml"
        - "pnpm-lock.yaml"
      run: node_modules/.bin/tsc --noEmit --project compilers/ssl/tsconfig.json
    typecheck-binary-editor:
      glob:
        - "binary-editor/**"
        - "binary/**"
        - "shared/**"
        - "tsconfig*.json"
        - "package.json"
        - "pnpm-workspace.yaml"
        - "pnpm-lock.yaml"
      run: node_modules/.bin/tsc --noEmit --project binary-editor/tsconfig.json
    typecheck-binary-editor-harness:
      glob:
        - "binary-editor/**"
        - "binary/**"
        - "client/**"
        - "shared/**"
        - "tsconfig*.json"
        - "package.json"
        - "pnpm-workspace.yaml"
        - "pnpm-lock.yaml"
      run: node_modules/.bin/tsc --noEmit --project binary-editor/test/harness/tsconfig.json
    typecheck-format:
      glob:
        - "format/**"
        - "shared/**"
        - "tsconfig*.json"
        - "package.json"
        - "pnpm-workspace.yaml"
        - "pnpm-lock.yaml"
      run: node_modules/.bin/tsc --noEmit --project format/tsconfig.json
    typecheck-transpilers:
      glob:
        - "transpilers/**"
        - "shared/**"
        - "tsconfig*.json"
        - "package.json"
        - "pnpm-workspace.yaml"
        - "pnpm-lock.yaml"
      run: node_modules/.bin/tsc --noEmit --project transpilers/tsconfig.json
    typecheck-plugins-tssl:
      glob:
        - "plugins/tssl-plugin/**"
        - "tsconfig*.json"
        - "package.json"
        - "pnpm-workspace.yaml"
        - "pnpm-lock.yaml"
      run: node_modules/.bin/tsc --noEmit --project plugins/tssl-plugin/tsconfig.json
    typecheck-plugins-td:
      glob:
        - "plugins/td-plugin/**"
        - "tsconfig*.json"
        - "package.json"
        - "pnpm-workspace.yaml"
        - "pnpm-lock.yaml"
      run: node_modules/.bin/tsc --noEmit --project plugins/td-plugin/tsconfig.json

# svelte-check lives here rather than in pre-commit: at ~12s it was the slowest command by
# 2.5x, and since a parallel hook cannot finish before its slowest member, it set the floor for
# every commit touching client, shared, binary or binary-editor - which is most of them.
# Moving it costs nothing in coverage, only lateness: it still runs before anything leaves the
# machine, and CI runs it unconditionally either way.
#
# Its glob keeps `shared/**` - .svelte files import it directly (dialog-editor/webview/*.svelte
# pulls dialog-model, dialog-reachability, dialog-edit-ops), and tsc cannot see a .svelte, so
# nothing else covers that edge. `server/**` is gone: the only client->server imports are in
# client/src/dialog-editor/test/harness/**, which are .ts and already covered by typecheck-client.
pre-push:
  parallel: true
  commands:
    typecheck-svelte:
      glob:
        - "client/**"
        - "shared/**"
        - "binary-editor/**"
        - "binary/**"
        - "tsconfig*.json"
        - "package.json"
        - "pnpm-workspace.yaml"
        - "pnpm-lock.yaml"
      run: pnpm typecheck:svelte
