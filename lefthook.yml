# Pre-commit static checks. Mirrors the fast gates in scripts/test.sh Phase 1
# (sans unit tests) so CI-breaking issues like unused exports, type errors,
# and lint regressions fail locally before a commit lands.
#
# Each command carries a glob so commits only pay for the checks their staged
# files can affect (a docs-only commit skips typechecks entirely). Typecheck
# globs are derived from real cross-package imports:
#   client -> server/src, shared/, binary-editor/, binary/ (webviews import all four)
#   binary-editor harness -> binary/src, client/src
#   server, binary, binary-editor, format, transpilers, scripts -> shared/
#   plugins -> self-contained (they read server/out build JSONs, not sources)
# A missed edge fails in CI (test.sh Phase 1 runs everything unconditionally),
# so the globs trade a small false-negative risk for per-commit speed.
pre-commit:
  parallel: true
  commands:
    knip:
      glob:
        - "*.{ts,mts,cts,tsx,js,mjs,svelte}"
        - "package.json"
        - "knip.ts"
        - "pnpm-workspace.yaml"
        - "pnpm-lock.yaml"
      run: pnpm knip
    knip-prod:
      glob:
        - "*.{ts,mts,cts,tsx,js,mjs,svelte}"
        - "package.json"
        - "knip.ts"
        - "pnpm-workspace.yaml"
        - "pnpm-lock.yaml"
      run: pnpm knip:prod
    oxlint:
      glob:
        - "*.{ts,mts,cts,tsx,js,mjs,cjs,svelte}"
        - ".oxlintrc.json"
      # {staged_files} scopes the lint to the commit and keeps untracked scratch files from
      # blocking it. oxlint applies its ignorePatterns to explicit args too, so a commit whose
      # staged files are ALL inside an ignored path (e.g. binary-editor/test/harness/**) leaves
      # zero files for it to check - --no-error-on-unmatched-pattern keeps that a pass rather
      # than an error. Full-tree runs stay in test.sh/CI.
      run: pnpm exec oxlint --no-error-on-unmatched-pattern {staged_files}
    oxfmt-check:
      glob:
        - "*.{ts,mts,cts,tsx,js,mjs,cjs,json,md,yml,yaml}"
        - ".oxfmtrc.json"
      run: pnpm exec oxfmt --check {staged_files}
    lint-shell:
      glob: "*.sh"
      run: pnpm lint:shell
    lint-workflows:
      glob:
        - ".github/**"
        - "actions/**"
        - "zizmor.yml"
      run: pnpm lint:workflows
    lint-scripts:
      glob:
        - "scripts/**"
        - "shared/**"
        - "tsconfig*.json"
        - "pnpm-workspace.yaml"
        - "pnpm-lock.yaml"
      run: pnpm lint:scripts
    typecheck-server:
      glob:
        - "server/**"
        - "shared/**"
        - "tsconfig*.json"
        - "package.json"
        - "pnpm-workspace.yaml"
        - "pnpm-lock.yaml"
      run: pnpm exec tsc --noEmit --project server/tsconfig.json
    typecheck-client:
      glob:
        - "client/**"
        - "server/**"
        - "shared/**"
        - "binary-editor/**"
        - "binary/**"
        - "tsconfig*.json"
        - "package.json"
        - "pnpm-workspace.yaml"
        - "pnpm-lock.yaml"
      run: pnpm exec tsc --noEmit --project client/tsconfig.json
    typecheck-svelte:
      # tsc skips .svelte files entirely; svelte-check type-checks the webview components (both editors).
      # Same dependency surface as typecheck-client (it runs on client/tsconfig.json).
      glob:
        - "client/**"
        - "server/**"
        - "shared/**"
        - "binary-editor/**"
        - "binary/**"
        - "tsconfig*.json"
        - "package.json"
        - "pnpm-workspace.yaml"
        - "pnpm-lock.yaml"
      run: pnpm typecheck:svelte
    typecheck-binary:
      glob:
        - "binary/**"
        - "shared/**"
        - "tsconfig*.json"
        - "package.json"
        - "pnpm-workspace.yaml"
        - "pnpm-lock.yaml"
      run: pnpm exec tsc --noEmit --project binary/tsconfig.json
    typecheck-image:
      glob:
        - "image/**"
        - "tsconfig*.json"
        - "package.json"
        - "pnpm-workspace.yaml"
        - "pnpm-lock.yaml"
      run: pnpm exec tsc --noEmit --project image/tsconfig.json
    typecheck-binary-editor:
      glob:
        - "binary-editor/**"
        - "binary/**"
        - "shared/**"
        - "tsconfig*.json"
        - "package.json"
        - "pnpm-workspace.yaml"
        - "pnpm-lock.yaml"
      run: pnpm exec tsc --noEmit --project binary-editor/tsconfig.json
    typecheck-binary-editor-harness:
      glob:
        - "binary-editor/**"
        - "binary/**"
        - "client/**"
        - "shared/**"
        - "tsconfig*.json"
        - "package.json"
        - "pnpm-workspace.yaml"
        - "pnpm-lock.yaml"
      run: pnpm exec tsc --noEmit --project binary-editor/test/harness/tsconfig.json
    typecheck-format:
      glob:
        - "format/**"
        - "shared/**"
        - "tsconfig*.json"
        - "package.json"
        - "pnpm-workspace.yaml"
        - "pnpm-lock.yaml"
      run: pnpm exec tsc --noEmit --project format/tsconfig.json
    typecheck-transpilers:
      glob:
        - "transpilers/**"
        - "shared/**"
        - "tsconfig*.json"
        - "package.json"
        - "pnpm-workspace.yaml"
        - "pnpm-lock.yaml"
      run: pnpm exec tsc --noEmit --project transpilers/tsconfig.json
    typecheck-plugins-tssl:
      glob:
        - "plugins/tssl-plugin/**"
        - "tsconfig*.json"
        - "package.json"
        - "pnpm-workspace.yaml"
        - "pnpm-lock.yaml"
      run: pnpm exec tsc --noEmit --project plugins/tssl-plugin/tsconfig.json
    typecheck-plugins-td:
      glob:
        - "plugins/td-plugin/**"
        - "tsconfig*.json"
        - "package.json"
        - "pnpm-workspace.yaml"
        - "pnpm-lock.yaml"
      run: pnpm exec tsc --noEmit --project plugins/td-plugin/tsconfig.json
